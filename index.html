<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoApp - Manajemen Tugas Modern</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-tasks"></i>
                    <h1>TodoApp</h1>
                </div>
                <div class="header-stats">
                    <div class="stat">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="totalTasks">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Selesai</span>
                        <span class="stat-value completed" id="completedTasks">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Pending</span>
                        <span class="stat-value pending" id="pendingTasks">0</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Add Task Section -->
        <section class="add-task-section">
            <div class="input-group">
                <input
                    type="text"
                    id="taskInput"
                    class="task-input"
                    placeholder="Tambahkan tugas baru..."
                    autocomplete="off"
                />
                <select id="prioritySelect" class="priority-select">
                    <option value="low">🟢 Rendah</option>
                    <option value="medium" selected>🟡 Sedang</option>
                    <option value="high">🔴 Tinggi</option>
                </select>
                <button id="addBtn" class="add-btn">
                    <i class="fas fa-plus"></i>
                    <span>Tambah</span>
                </button>
            </div>
            <div class="quick-add-buttons">
                <button class="quick-btn" onclick="quickAdd('Rapat dengan tim')">👥 Rapat</button>
                <button class="quick-btn" onclick="quickAdd('Review dokumen')">📄 Review</button>
                <button class="quick-btn" onclick="quickAdd('Update project')">🚀 Update</button>
                <button class="quick-btn" onclick="quickAdd('Email follow up')">📧 Email</button>
            </div>
        </section>

        <!-- Filter and Sort Section -->
        <section class="controls-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-list"></i> Semua
                </button>
                <button class="filter-btn" data-filter="pending">
                    <i class="fas fa-circle-notch"></i> Pending
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-circle"></i> Selesai
                </button>
                <button class="filter-btn" data-filter="high">
                    <i class="fas fa-exclamation-circle"></i> Prioritas Tinggi
                </button>
            </div>
            <div class="sort-buttons">
                <button class="sort-btn" title="Urutkan berdasarkan prioritas" onclick="sortTasks('priority')">
                    <i class="fas fa-arrow-up-down"></i> Prioritas
                </button>
                <button class="sort-btn" title="Urutkan berdasarkan waktu" onclick="sortTasks('time')">
                    <i class="fas fa-clock"></i> Waktu
                </button>
            </div>
        </section>

        <!-- Tasks List -->
        <section class="tasks-section">
            <div id="tasksList" class="tasks-list">
                <!-- Tasks akan ditampilkan di sini -->
            </div>
            <div id="emptyState" class="empty-state">
                <i class="fas fa-check-double"></i>
                <p>Tidak ada tugas. Tambahkan tugas baru untuk memulai!</p>
            </div>
        </section>

        <!-- Action Buttons -->
        <section class="action-buttons">
            <button id="clearCompleted" class="btn-action btn-warning">
                <i class="fas fa-trash-alt"></i> Hapus Selesai
            </button>
            <button id="clearAll" class="btn-action btn-danger">
                <i class="fas fa-broom"></i> Hapus Semua
            </button>
            <button id="exportBtn" class="btn-action btn-success">
                <i class="fas fa-download"></i> Export
            </button>
            <button id="importBtn" class="btn-action btn-info">
                <i class="fas fa-upload"></i> Import
            </button>
            <input type="file" id="importFile" accept=".json" style="display: none;" />
        </section>
    </div>

    <!-- Modal Edit -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditModal()">&times;</span>
            <h2>Edit Tugas</h2>
            <form id="editForm" onsubmit="saveEditedTask(event)">
                <div class="form-group">
                    <label for="editTaskInput">Tugas</label>
                    <input type="text" id="editTaskInput" required />
                </div>
                <div class="form-group">
                    <label for="editPriority">Prioritas</label>
                    <select id="editPriority">
                        <option value="low">🟢 Rendah</option>
                        <option value="medium">🟡 Sedang</option>
                        <option value="high">🔴 Tinggi</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editDueDate">Tenggat Waktu (Opsional)</label>
                    <input type="date" id="editDueDate" />
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Batal</button>
                    <button type="submit" class="btn-save">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
